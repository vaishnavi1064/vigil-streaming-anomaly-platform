# TEMPLATE. Not applied by kustomization.yaml and not a working Secret.
#
# Every value below is a placeholder. Applying this file as-is gives the cluster the string
# "REPLACE_ME" as its database password, which is the intended failure: it breaks loudly at
# first connection rather than starting a stack with a guessable credential.
#
# Create the real one out-of-band, never in git:
#
#   kubectl -n vigil create secret generic vigil-secrets \
#     --from-literal=POSTGRES_USER=vigil \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=CLICKHOUSE_USER=vigil \
#     --from-literal=CLICKHOUSE_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MINIO_ROOT_USER=vigil \
#     --from-literal=MINIO_ROOT_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=KAFKA_CLUSTER_ID="$(python -c 'import uuid,base64;print(base64.urlsafe_b64encode(uuid.uuid4().bytes).rstrip(b"=").decode())')"
#
# ANTHROPIC_API_KEY is optional and separate: with it absent the explainer reports itself
# unavailable and detection is unaffected (ADR-041), so it is not in the required set.
apiVersion: v1
kind: Secret
metadata:
  name: vigil-secrets
  namespace: vigil
  labels:
    app.kubernetes.io/part-of: vigil
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  CLICKHOUSE_USER: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  MINIO_ROOT_USER: "REPLACE_ME"
  MINIO_ROOT_PASSWORD: "REPLACE_ME"
  KAFKA_CLUSTER_ID: "REPLACE_ME"
