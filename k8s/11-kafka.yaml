# Kafka in KRaft mode: broker and controller in one process, as in compose.
#
# Single broker, replication factor 1. That is a real limitation and it is stated rather than
# papered over: no leader election, no ISR shrink, no partial-availability case, and recovery
# times measured on it do not project to a cluster (gap G-4 in docs/BLOCKERS.md). Raising
# `replicas` here would produce three brokers that still could not replicate anything,
# because the replication factors below are all 1.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: vigil
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vigil
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: vigil
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: vigil
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: vigil
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # Advertised as the stable per-pod DNS name a StatefulSet guarantees, never as a
            # pod IP: a rescheduled pod keeps the name and loses the address.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.vigil.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.vigil.svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: KAFKA_CLUSTER_ID
            # One broker: state the replication factors explicitly, or the 3-replica defaults
            # wedge the internal topics at startup.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            # Auto-create hides a topic-name typo as a silently empty stream, which is the
            # exact class of bug the reconciliation harness exists to catch.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "6"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xmx1200m -Xms1200m
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          # A TCP check for liveness, not the API-versions script. Flink's heartbeat timeout
          # taught this the hard way: a broker can answer a shallow check while being unable
          # to serve, and an expensive liveness probe that times out under load restarts a
          # broker that was merely busy.
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Topic creation as a Job, not an init container: it must run once per cluster rather than
# once per broker restart. Idempotent, so re-running it is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: vigil
  labels:
    app.kubernetes.io/name: kafka-topics
    app.kubernetes.io/part-of: vigil
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        app.kubernetes.io/part-of: vigil
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.9.1
          envFrom:
            - configMapRef:
                name: vigil-config
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              until /opt/kafka/bin/kafka-broker-api-versions.sh \
                    --bootstrap-server "$KAFKA_BOOTSTRAP" >/dev/null 2>&1; do
                echo "waiting for kafka at $KAFKA_BOOTSTRAP"
                sleep 5
              done
              create() {
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" \
                  --create --if-not-exists --topic "$1" --partitions "$2" --replication-factor 1
              }
              create "$READINGS_TOPIC" "$READINGS_PARTITIONS"
              # Context is low volume and every consumer reads all of it, so one partition:
              # partitioning would buy nothing and cost total ordering of the markers.
              create "$CONTEXT_TOPIC" 1
              create "$SCORES_TOPIC" "$READINGS_PARTITIONS"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP" --list
