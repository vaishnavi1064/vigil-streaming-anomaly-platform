[project]
name = "vigil"
version = "0.1.0"
description = "Context-conditioned real-time anomaly detection on a provably-correct streaming backbone"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "numpy>=2.1",
    "paho-mqtt>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The serving store (ADR-006). Core rather than optional: the dashboard API's metrics
    # endpoints have nowhere else to read from, and a pure-HTTP client is a small dependency.
    "clickhouse-connect>=0.8",
    # The /metrics exporter. Core because the endpoint is part of the API, and the whole
    # point of Phase 6's observability is that it is always there to scrape.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
foundation = [
    # Zero-shot detection spine (ADR-001). CPU torch is enough: chronos-bolt-tiny measured
    # 0.64 ms per window at batch 32 on the reference laptop.
    "torch>=2.4",
    "chronos-forecasting>=1.5",
]
explain = [
    # The VLM explainer renders a flagged window as a plot and sends it to a hosted model
    # (ADR-004, B-1, ADR-041). Nothing here loads a model locally.
    "matplotlib>=3.9",
    "httpx>=0.27",
    "anthropic>=0.40",
]
lake = [
    # The Iceberg event lake on MinIO (ADR-043, ADR-044). Optional because the detection
    # spine and the dashboard API never touch it: only the lake sink and the reconciliation
    # harness's --audit-lake pass do, and both import pyiceberg lazily so the rest of the
    # platform starts without any of this installed.
    "pyiceberg[s3fs,sql-postgres,pyiceberg-core]>=0.9",
    "pyarrow>=17",
]
train = [
    # The QLoRA fine-tune of the tool-calling planner (B-3). Installed on the GPU host only:
    # none of it fits in 4 GB of VRAM, and `train_planner.py --dry-run` deliberately works
    # without any of it so the pipeline can be checked before the GPU hour is spent.
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44",
    "datasets>=3.0",
    "accelerate>=0.34",
]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "httpx>=0.27",
    "playwright>=1.48",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the docker compose stack running (deselect with -m 'not integration')",
    "slow: needs model weights or takes noticeably longer; still runs by default, deselect with -m 'not slow'",
    "soak: multi-hour run; never part of the default suite",
]
addopts = "-q --strict-markers"
timeout = 300

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
