name: ci

# Two jobs, deliberately separated. `unit` is fast and runs on every push; `integration`
# stands up real Kafka and real Postgres, because the properties it checks -- upsert conflict
# targets, foreign keys, consumer-group behaviour -- are properties of those systems, and a
# fake would only prove the fake agrees with itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  unit:
    name: unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Excludes `integration` (needs the stack, covered by the next job) and `slow` (needs
      # model weights from Hugging Face, which is a third-party dependency this job should
      # not fail on).
      - name: Unit tests
        run: pytest -m "not integration and not slow" --timeout 300

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: vigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigil -d vigil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Written here rather than committed: the repo has no .env by design, and CI needs one
      # because the config loader refuses to start on a missing variable.
      - name: Write CI environment
        run: |
          cat > .env <<'ENVFILE'
          POSTGRES_USER=vigil
          POSTGRES_PASSWORD=ci-only-not-a-real-secret
          POSTGRES_DB=vigil
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          KAFKA_BOOTSTRAP=localhost:19092
          KAFKA_CLUSTER_ID=ci-cluster-id-placeholder
          READINGS_TOPIC=sensor.readings
          READINGS_PARTITIONS=6
          CONTEXT_TOPIC=ops.context
          SCORES_TOPIC=detections.window_scores
          MQTT_HOST=mqtt.tdengine.com
          MQTT_PORT=1883
          MQTT_TOPIC=inverters
          ENVFILE

      - name: Integration tests
        run: pytest -m integration --timeout 600

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NFR-10 says no hardcoded secrets. Asserting it here means a regression fails the
      # build rather than being caught by whoever happens to read the diff.
      - name: .env must not be committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked; secrets must come from the environment"
            exit 1
          fi

      - name: .env.example must carry no filled-in secrets
        run: |
          if grep -Eq '^(POSTGRES_PASSWORD|KAFKA_CLUSTER_ID)=.+' .env.example; then
            echo "::error::.env.example has a value where it should have a blank"
            exit 1
          fi

      - name: Datasets must not be committed
        run: |
          if git ls-files | grep -q '^Datasets/'; then
            echo "::error::Datasets/ is tracked; it is fetched on demand"
            exit 1
          fi

  standards:
    name: repository standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md: no emoji anywhere, in code, docs, or commit messages. Checked rather than
      # remembered.
      - name: No emoji
        run: |
          python - <<'PY'
          import pathlib, sys, unicodedata

          SKIP = {".git", ".venv", "Datasets", "node_modules", "__pycache__", "docs/images"}
          offenders = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or path.suffix in {".png", ".jpg", ".svg", ".zip"}:
                  continue
              if any(part in SKIP for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for char in line:
                      if unicodedata.category(char) == "So" and ord(char) > 0x2100:
                          offenders.append(f"{path}:{line_no}: {char!r}")
          if offenders:
              print("\n".join(offenders[:40]))
              sys.exit(f"{len(offenders)} emoji found; CLAUDE.md forbids them")
          print("no emoji found")
          PY

      - name: Every ADR is numbered and complete
        run: |
          python - <<'PY'
          import pathlib, re, sys

          text = pathlib.Path("docs/DECISIONS.md").read_text(encoding="utf-8")
          adrs = re.findall(r"^## ADR-(\d+)\s*[-—]\s*(.+)$", text, re.MULTILINE)
          numbers = [int(n) for n, _ in adrs]
          if numbers != list(range(1, len(numbers) + 1)):
              sys.exit(f"ADR numbering has a gap or duplicate: {numbers}")
          # An ADR without alternatives is a decision with no recorded trade-off, which is
          # the thing CLAUDE.md asks for.
          sections = re.split(r"^## ADR-", text, flags=re.MULTILINE)[1:]
          missing = [s.splitlines()[0] for s in sections if "**Alternatives:**" not in s]
          if missing:
              sys.exit("ADRs with no alternatives recorded:\n  " + "\n  ".join(missing))
          print(f"{len(adrs)} ADRs, numbered 1..{len(adrs)}, all with alternatives")
          PY

      - name: BLOCKERS.md is present and current
        run: |
          test -f docs/BLOCKERS.md || { echo "::error::docs/BLOCKERS.md is missing"; exit 1; }
          grep -q "Open" docs/BLOCKERS.md || { echo "::error::BLOCKERS.md has no open section"; exit 1; }
