# Single-node local stack. Sized for a laptop: one broker, replication factor 1,
# small heaps. Not a production topology -- see docs/SCALE.md for what the
# measured numbers do and do not project to.
#
# Every credential comes from .env (copy .env.example). The ${VAR:?...} form makes
# compose refuse to start rather than silently fall back to a default.

name: vigil

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: vigil-kafka
    ports:
      # 19092 is the host-facing listener; in-network clients use kafka:9092.
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set in .env}

      # Single broker: nothing can be replicated, so say so explicitly rather than
      # letting the 3-replica defaults wedge the internal topics on startup.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Topics are created explicitly by the topics service. Auto-create hides
      # typos in topic names as silently-empty streams, which is exactly the class
      # of bug the reconciliation harness exists to catch.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx1200m -Xms1200m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  topics:
    # One-shot: creates the topics the platform needs, then exits 0. Idempotent, so
    # it is safe on every `docker compose up`.
    image: apache/kafka:3.9.1
    container_name: vigil-topics
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      READINGS_TOPIC: ${READINGS_TOPIC:?READINGS_TOPIC must be set in .env}
      READINGS_PARTITIONS: ${READINGS_PARTITIONS:?READINGS_PARTITIONS must be set in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1
        }
        create "$$READINGS_TOPIC" "$$READINGS_PARTITIONS"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: vigil-postgres
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be set in .env}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      # Postgres holds episodes and app state only -- never raw readings -- so it
      # stays small and these settings stay modest.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=60
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  kafka-data:
  postgres-data:
