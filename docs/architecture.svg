<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 650" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Platform architecture</title>
<desc>Data flows through ingestion, Kafka, and Flink with exactly-once processing into a detector. A reconciliation harness emits a pipeline-health signal that conditions the detector, separating real anomalies from pipeline artifacts. Real anomalies are explained and remediated on a rare path; data is served to a dashboard. Chaos and load harness exercise the backbone.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-weight:500;font-size:14px}
.ts{font-weight:400;font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.gray .th{fill:#2C2C2A}.gray .ts{fill:#444441}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.teal .th{fill:#04342C}.teal .ts{fill:#085041}
.edge{stroke:#73726c;stroke-width:1.5;fill:none}
.wire{stroke:#1D9E75;stroke-width:2;fill:none}
.loose{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.gray rect{fill:#2C2C2A;stroke:#B4B2A9}
.gray .th{fill:#F1EFE8}.gray .ts{fill:#D3D1C7}
.teal rect{fill:#04342C;stroke:#5DCAA5}
.teal .th{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.edge{stroke:#9c9a92}.loose{fill:#c2c0b6}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="gray">
<rect x="250" y="40" width="180" height="52" rx="8"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Ingestion</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">gap-fill + backfill</text>
</g>
<g class="gray">
<rect x="250" y="124" width="180" height="52" rx="8"/>
<text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Kafka</text>
<text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">partitioned bus</text>
</g>
<g class="gray">
<rect x="250" y="208" width="180" height="52" rx="8"/>
<text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">Flink</text>
<text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">exactly-once + windows</text>
</g>
<g class="gray">
<rect x="250" y="292" width="180" height="52" rx="8"/>
<text class="th" x="340" y="312" text-anchor="middle" dominant-baseline="central">Detection</text>
<text class="ts" x="340" y="330" text-anchor="middle" dominant-baseline="central">windowed scoring</text>
</g>
<g class="teal">
<rect x="250" y="376" width="180" height="52" rx="8"/>
<text class="th" x="340" y="396" text-anchor="middle" dominant-baseline="central">Conditioning</text>
<text class="ts" x="340" y="414" text-anchor="middle" dominant-baseline="central">real vs. artifact</text>
</g>
<g class="gray">
<rect x="250" y="460" width="180" height="52" rx="8"/>
<text class="th" x="340" y="480" text-anchor="middle" dominant-baseline="central">Serving &amp; storage</text>
<text class="ts" x="340" y="498" text-anchor="middle" dominant-baseline="central">OLAP · lake · Postgres</text>
</g>
<g class="gray">
<rect x="250" y="544" width="180" height="52" rx="8"/>
<text class="th" x="340" y="564" text-anchor="middle" dominant-baseline="central">Dashboard</text>
<text class="ts" x="340" y="582" text-anchor="middle" dominant-baseline="central">React + FastAPI</text>
</g>
<g class="gray">
<rect x="40" y="208" width="170" height="52" rx="8"/>
<text class="th" x="125" y="228" text-anchor="middle" dominant-baseline="central">Chaos / load</text>
<text class="ts" x="125" y="246" text-anchor="middle" dominant-baseline="central">injected faults</text>
</g>
<g class="teal">
<rect x="40" y="376" width="170" height="52" rx="8"/>
<text class="th" x="125" y="396" text-anchor="middle" dominant-baseline="central">Reconciliation</text>
<text class="ts" x="125" y="414" text-anchor="middle" dominant-baseline="central">emits health signal</text>
</g>
<g class="gray">
<rect x="460" y="376" width="180" height="52" rx="8"/>
<text class="th" x="550" y="396" text-anchor="middle" dominant-baseline="central">Explain + remediate</text>
<text class="ts" x="550" y="414" text-anchor="middle" dominant-baseline="central">VLM + gated agent</text>
</g>

<line x1="340" y1="94" x2="340" y2="118" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="178" x2="340" y2="202" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="262" x2="340" y2="286" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="346" x2="340" y2="370" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="430" x2="340" y2="454" class="edge" marker-end="url(#arrow)"/>
<line x1="340" y1="514" x2="340" y2="538" class="edge" marker-end="url(#arrow)"/>
<line x1="212" y1="234" x2="244" y2="234" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="212" y1="402" x2="244" y2="402" class="wire" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="432" y1="402" x2="454" y2="402" class="edge" marker-end="url(#arrow)"/>
<line x1="548" y1="430" x2="436" y2="556" class="edge" marker-end="url(#arrow)"/>

<rect x="250" y="608" width="14" height="14" rx="3" fill="#1D9E75"/>
<text class="ts loose" x="272" y="615" dominant-baseline="central">teal = the correctness-conditioning core (the contribution)</text>
</svg>
